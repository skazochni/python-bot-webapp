<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Песочница Python</title>

<!-- Telegram Web App API -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- CodeMirror 5 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

<style>
  body {
    margin: 0;
    padding: 12px;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #editor {
    height: 60vh;
    border-radius: 10px;
    overflow: hidden;
    font-size: 14px;
  }
  #runBtn {
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer;
  }
  #terminal {
    background: #000;
    color: #0f0;
    font-family: "Courier New", monospace;
    padding: 12px;
    border-radius: 10px;
    min-height: 80px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .stderr { color: #ff5555; }
</style>
</head>
<body>

<div id="editor"></div>
<button id="runBtn">▶️ Запустить код</button>
<button id="saveBtn" style="margin-top:8px;padding:12px;border:none;border-radius:10px;font-size:16px;background:var(--tg-theme-hint-color,#999);color:#fff;cursor:pointer;">💾 Сохранить код</button>
<div id="terminal">Готов к запуску...</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

const editor = CodeMirror(document.getElementById("editor"), {
  mode: "python",
  theme: "dracula",
  lineNumbers: true,
  value: 'print("Привет, Telegram!")\n',
});

// Если открыт с ?code=... — подставляем сохранённый код
try {
  const params = new URLSearchParams(window.location.search);
  const saved = params.get("code");
  if (saved) {
    editor.setValue(decodeURIComponent(escape(atob(saved.replace(/-/g, "+").replace(/_/g, "/")))));
  }
} catch (e) { /* игнорируем */ }

const terminal = document.getElementById("terminal");

document.getElementById("saveBtn").addEventListener("click", () => {
  Telegram.WebApp.sendData(editor.getValue());
  terminal.innerHTML = "💾 Код отправлен боту на сохранение.";
});

document.getElementById("runBtn").addEventListener("click", async () => {
  const code = editor.getValue();
  terminal.innerHTML = "Выполнение...";

  try {
    const response = await fetch("https://wandbox.org/api/compile.json", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        compiler: "cpython-3.10.15",
        code: code,
        stdin: "",
      }),
    });

    if (!response.ok) {
      terminal.innerHTML = `Ошибка сервера: ${response.status} ${response.statusText}`;
      return;
    }

    const data = await response.json();
    let output = "";

    if (data.compiler_error) {
      output += `<span class="stderr">${escapeHtml(data.compiler_error)}</span>\n`;
    }
    if (data.program_message) {
      output += data.program_message;
    }
    if (data.program_error) {
      output += `\n<span class="stderr">${escapeHtml(data.program_error)}</span>`;
    }

    terminal.innerHTML = output === "" ? "(пустой вывод)" : output;
  } catch (err) {
    terminal.innerHTML = `<span class="stderr">Сетевая ошибка: ${escapeHtml(String(err))}</span>`;
  }
});

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
</script>
</body>
</html>
